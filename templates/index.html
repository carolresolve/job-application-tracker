{% extends 'base.html' %}

{% block content %}
<div class="boas-vindas">
    <h2>🚀 Painel de Controle</h2>
    <p>Gerencie seus candidatos, empresas e candidaturas em um só lugar.</p>
</div>

<div class="dashboard-grid">
    <div class="card">
        <h3>Candidatos</h3>
        <span class="card-number">{{ total_candidatos }}</span>
        <a href="/candidatos" class="btn-primary" style="text-align: center;">Ver Todos</a>
    </div>

    <div class="card">
        <h3>Empresas</h3>
        <span class="card-number">{{ total_empresas }}</span>
        <a href="/empresas" class="btn-primary" style="text-align: center;">Ver Todas</a>
    </div>

    <div class="card">
        <h3>Candidaturas</h3>
        <span class="card-number">{{ total_candidaturas }}</span>
        <div style="display: flex; gap: 0.5rem;">
            <a href="/candidaturas" class="btn-primary" style="flex: 1; text-align: center;">Ver Todas</a>
            <a href="/candidaturas/nova" class="btn-secondary" style="text-align: center;">+ Nova</a>
        </div>
    </div>
</div>
{% endblock %}
