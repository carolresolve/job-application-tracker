{% extends 'base.html' %}

{% block content %}
<h2>Cadastrar Novo Candidato</h2>

<form method="POST" action="/candidatos/novo" class="form-container">
    <div class="form-group">
        <label for="nome">Nome Completo:*</label>
        <input type="text" id="nome" name="nome" class="form-control" required placeholder="Ex: Ana Silva">
    </div>

    <div class="form-group">
        <label for="email">E-mail:*</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="ana.silva@email.com">
    </div>

    <div class="form-group">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="Ex: 912 345 678">
    </div>

    <div class="form-group">
        <label for="area">Área de Atuação / Cargo:</label>
        <input type="text" id="area" name="area" class="form-control" placeholder="Ex: Desenvolvedora Frontend, Designer...">
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button type="submit" class="btn-primary">Salvar Candidato</button>
        <a href="/candidatos" class="btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
