<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Job Tracker</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}?v=1.2"
    />
  </head>
  <body>
    <header
      style="
        background: #1f2937;
        color: white;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      "
    >
      <h1 style="margin: 0; font-size: 1.25rem">
        <a href="/" style="color: white; text-decoration: none">Job Tracker</a>
      </h1>
      <nav style="display: flex; gap: 1.5rem">
        <a href="/" style="color: #d1d5db; text-decoration: none">Início</a>
        <a href="/empresas" style="color: #d1d5db; text-decoration: none"
          >Empresas</a
        >
        <a href="/candidatos" style="color: #d1d5db; text-decoration: none"
          >Candidatos</a
        >
        <a href="/candidaturas" style="color: #d1d5db; text-decoration: none"
          >Candidaturas</a
        >
      </nav>
    </header>

    <main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
