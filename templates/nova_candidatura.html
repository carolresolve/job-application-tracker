{% extends 'base.html' %}

{% block content %}
<h2>Cadastrar Nova Candidatura</h2>

{% if erro %}
<div class="alert-error">
    {{ erro }}
</div>
{% endif %}

<form method="POST" action="/candidaturas/nova" class="form-container">
    <div class="form-group">
        <label for="candidato_id">Candidato:*</label>
        <select id="candidato_id" name="candidato_id" class="form-control" required>
            <option value="">Selecione um candidato</option>
            {% for c in candidatos %}
            <option value="{{ c._id }}">{{ c.nome }} ({{ c.email }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="empresa_id">Empresa:*</label>
        <select id="empresa_id" name="empresa_id" class="form-control" required>
            <option value="">Selecione uma empresa</option>
            {% for e in empresas %}
            <option value="{{ e._id }}">{{ e.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="vaga">Vaga / Cargo:*</label>
        <input type="text" id="vaga" name="vaga" class="form-control" placeholder="Ex: Desenvolvedor Python" required>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button type="submit" class="btn-primary">Salvar Candidatura</button>
        <a href="/candidaturas" class="btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
