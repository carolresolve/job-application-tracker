{% extends 'base.html' %}

{% block content %}
<h2>Cadastrar Nova Empresa</h2>

{% if erro %}
<div class="alert-error">
    {{ erro }}
</div>
{% endif %}

<form method="POST" action="/empresas/nova" class="form-container">
    <div class="form-group">
        <label for="nome">Nome da Empresa:*</label>
        <input type="text" id="nome" name="nome" class="form-control" required placeholder="Ex: Tech Solutions">
    </div>

    <div class="form-group">
        <label for="nif">NIF (9 dígitos):*</label>
        <input type="text" id="nif" name="nif" class="form-control" required placeholder="Ex: 123456789">
    </div>

    <div class="form-group">
        <label for="email">E-mail:*</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="empresa@exemplo.com">
    </div>

    <div class="form-group">
        <label for="setor">Setor:*</label>
        <select id="setor" name="setor" class="form-control" required>
            <option value="">-- Selecione um setor --</option>
            {% for s in setores %}
                <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <fieldset class="fieldset-box">
        <legend>Morada / Localidade</legend>
        
        <div class="form-group">
            <label for="rua">Rua:*</label>
            <input type="text" id="rua" name="rua" class="form-control" required placeholder="Ex: Av. da Liberdade">
        </div>

        <div class="form-group">
            <label for="numero">Número:*</label>
            <input type="text" id="numero" name="numero" class="form-control" required placeholder="Ex: 12">
        </div>

        <div class="form-group">
            <label for="cidade">Cidade:*</label>
            <input type="text" id="cidade" name="cidade" class="form-control" required placeholder="Ex: Lisboa">
        </div>

        <div class="form-group">
            <label for="cp">Código Postal (XXXX-YYY):*</label>
            <input type="text" id="cp" name="cp" class="form-control" required placeholder="Ex: 1000-001">
        </div>
    </fieldset>

    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <button type="submit" class="btn-primary">Salvar Empresa</button>
        <a href="/empresas" class="btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
